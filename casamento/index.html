<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confirmação de Presença</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    overflow-x:hidden;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px 15px;

    font-family:'Cormorant Garamond', serif;

    background:
    radial-gradient(circle at top left,
    rgba(180,190,160,0.15),
    transparent 28%),

    radial-gradient(circle at bottom right,
    rgba(180,190,160,0.15),
    transparent 28%),

    linear-gradient(
        135deg,
        #f7f5f0,
        #f3f0ea
    );
}

/* ===============================
CARD
=============================== */

.card{

    width:100%;
    max-width:640px;

    position:relative;

    padding:60px 45px;

    border-radius:34px;

    overflow:hidden;

    background:rgba(255,255,255,0.96);

    backdrop-filter:blur(4px);

    box-shadow:
    0 18px 45px rgba(0,0,0,0.06),
    inset 0 0 0 1px rgba(170,180,150,0.10);
}

/* ===============================
FLORES
=============================== */

.floral{

    position:absolute;

    pointer-events:none;

    opacity:0.95;

    z-index:1;
}

.floral img{

    width:100%;
    display:block;
}

/* IMPORTANTE:
SUBSTITUA PELOS SEUS PNG/SVG */

.floral-top{

    width:250px;

    top:-30px;
    left:-40px;
}

.floral-bottom{

    width:300px;

    bottom:-70px;
    right:-70px;

    transform:rotate(180deg);
}

/* ===============================
CONTEÚDO
=============================== */

.content{

    position:relative;
    z-index:2;

    text-align:center;
}

/* SUBTITLE */

.subtitle{

    font-size:0.9rem;

    letter-spacing:6px;

    color:#7f8a71;

    text-transform:uppercase;

    margin-bottom:18px;
}

/* DIVISOR */

.divider,
.mini-divider{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;
}

.divider{

    margin-bottom:22px;
}

.mini-divider{

    margin:30px 0;
}

.divider::before,
.divider::after,
.mini-divider::before,
.mini-divider::after{

    content:"";

    width:75px;
    height:1px;

    background:#d8c799;
}

.divider i,
.mini-divider i{

    font-size:10px;

    color:#d8c799;
}

/* NOMES */

.names{

    line-height:1;

    margin-bottom:20px;
}

.main-name{

    font-family:'Great Vibes', cursive;

    font-size:5.8rem;

    font-weight:400;

    color:#6f7d61;
}

.amp{

    display:block;

    margin:10px 0;

    font-size:3rem;

    color:#d2b778;
}

/* TEXTO */

.message{

    font-size:1.7rem;

    color:#6f7d61;

    line-height:1.3;
}

/* ===============================
INFO
=============================== */

.info-box{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    margin:45px 0;

    border-top:1px solid #e0d5b5;
    border-bottom:1px solid #e0d5b5;

    padding:10px 0;
}

.info-item{

    padding:35px 18px;

    position:relative;

    min-height:160px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.info-item:not(:last-child)::after{

    content:"";

    position:absolute;

    top:20px;
    right:0;

    width:1px;
    height:calc(100% - 40px);

    background:#e0d5b5;
}

.info-item i{

    font-size:1.6rem;

    margin-bottom:14px;

    color:#71815d;
}

/* DIA */

.day-text{

    font-size:1.5rem !important;

    letter-spacing:3px !important;

    font-weight:600;
}

/* HORÁRIO */

.hour-text{

    font-size:1.7rem !important;

    letter-spacing:2px !important;

    font-weight:600;
}

/* DATA */

.info-item h3{

    font-size:6rem;

    line-height:1;

    font-weight:700;

    color:#687659;

    margin-bottom:10px;
}

.info-item p{

    font-size:2rem;

    letter-spacing:2px;

    color:#71815d;

    margin-top:6px;
}

.central-date{

    padding-top:38px;
    padding-bottom:38px;
}

/* ===============================
FORM
=============================== */

.confirm-form{

    display:flex;
    flex-direction:column;

    gap:16px;
}

/* INPUT */

.input-group{

    position:relative;
}

.input-group i{

    position:absolute;

    top:50%;
    left:22px;

    transform:translateY(-50%);

    color:#7a876a;

    font-size:1rem;
}

.input-group input{

    width:100%;
    height:62px;

    border-radius:999px;

    border:1.5px solid #a9b699;

    background:rgba(255,255,255,0.8);

    outline:none;

    padding:0 22px 0 55px;

    font-size:1.2rem;

    color:#5f6f50;

    transition:0.3s ease;

    font-family:'Cormorant Garamond', serif;
}

.input-group input:focus{

    border-color:#71815d;

    box-shadow:
    0 0 0 4px rgba(111,125,93,0.08);
}

/* BOTÕES */

.confirm-button,
.map-button{

    width:100%;
    height:64px;

    border:none;

    border-radius:999px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    text-decoration:none;

    cursor:pointer;

    font-size:1.25rem;

    font-family:'Cormorant Garamond', serif;

    transition:0.3s ease;
}

/* WHATSAPP */

.confirm-button{

    color:white;

    background:
    linear-gradient(
        135deg,
        #92a07c,
        #71815d
    );

    box-shadow:
    0 10px 22px rgba(111,125,93,0.18);
}

.confirm-button:hover{

    transform:translateY(-2px);
}

/* MAPA */

.map-button{

    color:#6f7d61;

    background:#f8f5ef;

    border:1px solid #d9ccaa;
}

.map-button:hover{

    background:#f3eee4;
}

/* ===============================
LOCAL
=============================== */

.location{

    margin-top:10px;

    color:#71815d;
}

.location i{

    font-size:1.5rem;

    margin-bottom:10px;
}

.location p{

    font-size:1.5rem;

    line-height:1.5;
}

/* ===============================
RESPONSIVO
=============================== */

@media(max-width:768px){

    body{
        padding:18px 12px;
    }

    .card{

        padding:42px 22px;

        border-radius:28px;
    }

    .main-name{

        font-size:4.4rem;
    }

    .amp{

        font-size:2.5rem;
    }

    .message{

        font-size:1.35rem;
    }

    .info-box{

        grid-template-columns:1fr;
    }

    .info-item{

        border-bottom:1px solid #e0d5b5;
    }

    .info-item:last-child{

        border-bottom:none;
    }

    .info-item:not(:last-child)::after{

        display:none;
    }

    .info-item h3{

        font-size:4.5rem;
    }

    .day-text{

        font-size:1.4rem !important;
    }

    .hour-text{

        font-size:1.5rem !important;
    }

    .location p{

        font-size:1.2rem;
    }

    .confirm-button,
    .map-button{

        font-size:1.1rem;
    }

    .floral-top{

        width:180px;

        top:-15px;
        left:-35px;
    }

    .floral-bottom{

        width:220px;

        bottom:-40px;
        right:-50px;
    }
}

</style>
</head>

<body>

<div class="card">

    <!-- ==========================
    TROQUE PELAS SUAS IMAGENS
    =========================== -->

    <div class="floral floral-top">

        <!-- COLOQUE AQUI SUA IMAGEM -->
        <!-- EXEMPLO:
        src="flores-top.png"
        -->

        <img src="flores-top.png">

    </div>

    <div class="floral floral-bottom">

        <!-- COLOQUE AQUI SUA IMAGEM -->
        <!-- EXEMPLO:
        src="flores-bottom.png"
        -->

        <img src="flores-bottom.png">

    </div>

    <div class="content">

        <!-- ALTERE AQUI -->

        <div class="subtitle">
            CASAMENTO
        </div>

        <div class="divider">
            <i class="fa-solid fa-diamond"></i>
        </div>

        <div class="names">

            <div class="main-name">
                Joselis
            </div>

            <span class="amp">&</span>

            <div class="main-name">
                Talia
            </div>

        </div>

        <div class="message">
            Venha celebrar conosco este dia especial
        </div>

        <div class="mini-divider">
            <i class="fa-solid fa-diamond"></i>
        </div>

        <!-- INFO -->

        <div class="info-box">

            <!-- DIA -->

            <div class="info-item">

                <i class="fa-regular fa-calendar"></i>

                <p class="day-text">
                    SÁBADO
                </p>

            </div>

            <!-- DATA -->

            <div class="info-item central-date">

                <h3>31</h3>

                <p>OUTUBRO 2026</p>

            </div>

            <!-- HORÁRIO -->

            <div class="info-item">

                <i class="fa-regular fa-clock"></i>

                <p class="hour-text">
                    18:00
                </p>

            </div>

        </div>

        <!-- FORM -->

        <form class="confirm-form" id="confirmForm">

            <div class="input-group">

                <i class="fa-regular fa-user"></i>

                <input
                type="text"
                id="guestName"
                placeholder="Digite nome e sobrenome"
                required>

            </div>

            <button type="submit" class="confirm-button">

                <i class="fa-brands fa-whatsapp"></i>

                Confirmar Presença

            </button>

            <a
            href="https://maps.app.goo.gl/Xxs1i8QyqXPdXGcFA"
            target="_blank"
            class="map-button">

                <i class="fa-solid fa-location-dot"></i>

                Ver Endereço

            </a>

        </form>

        <div class="mini-divider">
            <i class="fa-solid fa-diamond"></i>
        </div>

        <!-- LOCAL -->

        <div class="location">

            <i class="fa-solid fa-location-dot"></i>

            <p>
                Av. Kakogawa, 1095 -<br>
Jardim Vitória, Maringá - PR, CEP: 87023-729
            </p>

        </div>

    </div>

</div>

<script>

const whatsappNumber = '554396728578';

const form = document.getElementById('confirmForm');

form.addEventListener('submit', function(event){

    event.preventDefault();

    const name = document
    .getElementById('guestName')
    .value
    .trim();

    const splitName = name.split(' ');

    if(splitName.length < 2){

        alert('Digite nome e sobrenome.');

        return;
    }

    const message =
`Olá! Meu nome é ${name} e estou confirmando presença no seu casamento 💍`;

    const url =
`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

    window.open(url, '_blank');

});

</script>

</body>
</html>
